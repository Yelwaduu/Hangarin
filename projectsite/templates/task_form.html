{% extends 'base.html' %}

{% block content %}

<style>
    .form-page .card {
        width: 80%;
        margin-left: auto;
        margin-right: auto;
        background-color: #4a4a4a;
        color: #f1f1f1;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        animation: slideUp 0.5s ease-out both;
    }

    /* Full width on small screens */
    @media (max-width: 767px) {
        .form-page .card { width: 100%; }
    }

    .form-page .card-header {
        border-bottom: 1px solid #626262;
        border-radius: 20px 20px 0 0;
    }

    .form-page .card-title,
    .form-page .card-category {
        color: #f1f1f1;
    }

    /* Centered form block; labels and fields share the same left edge */
    .form-page .form-wrap {
        max-width: 480px;
        margin: 0 auto;
    }

    .form-page .form-group {
        padding-left: 0;
        padding-right: 0;
    }

    .form-page .form-group label,
    .form-page label {
        display: block;
        width: 100%;
        text-align: left;
        color: #fff !important;
        margin-bottom: 6px;
    }

    .form-page .form-control {
        background-color: #5a5a5a;
        color: #fff;
        border-color: #6b6b6b;
    }

    .form-page .form-control:focus {
        background-color: #636363;
        color: #fff;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .form-page .card { animation: none; }
    }
</style>

<div class="content form-page">
    <div class="container-fluid">
        <h4 class="page-title">Tasks</h4>

        <div class="row">
            <div class="col-md-12">
                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            {% if object %}Update Task{% else %}Add New Task{% endif %}
                        </div>
                        <div class="card-category">
                            {% if object %}Edit Task{% else %}Create a new task{% endif %}
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="form-wrap">
                            <form action="" method="post" novalidate>
                                {% csrf_token %}
                                {% include 'includes/form.html' %}

                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary btn-rounded">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
